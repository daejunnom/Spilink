name: Prepare preview dependencies
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml, scripts/prepare-engine.mjs]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run prepare:engine
      - name: Save reproducible dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git add -f src/lib/vendor/engine.js static/licenses/triangle.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Pin preview dependencies'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-runtime
          path: |
            src/lib/vendor/engine.js
            package-lock.json
            static/licenses/triangle.txt
