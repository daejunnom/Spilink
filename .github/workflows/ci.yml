name: CI and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spilink-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_PATH: /Spilink
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package source
        if: always()
        run: git archive --format=zip HEAD -o spilink-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-checks
          retention-days: 7
          path: |
            test-results/
            playwright-report/
            spilink-source.zip
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
  deploy:
    name: Publish Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
